# Random antags sec can summon if they killed all the roundstart ones
- type: entity
  parent: BaseGameRule
  id: SecurityRandomAntagRule
  components:
  - type: SubGamemodes
    rules:
    - id: SleeperAgents
      prob: 0.1
    - id: LoneAbductorSpawn
      prob: 0.1
    - id: DuoAbductorSpawn
      prob: 0.1
    - id: NinjaSpawn
      prob: 0.05 # even more antags!
    - id: LoneOpsSpawn
      prob: 0.05
